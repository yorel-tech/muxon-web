<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VM console</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #111;
      }
      #screen {
        width: 100%;
        height: 100%;
        min-height: 0;
        box-sizing: border-box;
      }
      #err {
        color: #f87171;
        font-family: system-ui, sans-serif;
        padding: 1rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="err"></div>
    <div id="screen"></div>
    <script type="module">
      const errEl = document.getElementById('err');
      const params = new URLSearchParams(window.location.search);
      const ws = params.get('ws');
      const pwd = params.get('pwd') || '';
      if (!ws) {
        errEl.textContent = 'Missing ws query parameter';
        throw new Error('missing ws');
      }

      let rfb = null;

      function bumpNovncLayout() {
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            if (rfb && typeof rfb._handleResize === 'function') {
              rfb._handleResize();
            }
          });
        });
      }

      window.addEventListener('message', (ev) => {
        if (ev.data?.type === 'infron-console-layout') {
          bumpNovncLayout();
        }
      });

      try {
        const novncMod = await import(
          'https://cdn.jsdelivr.net/npm/@novnc/novnc@1.6.0/+esm'
        );
        const RFB =
          typeof novncMod.default === 'function'
            ? novncMod.default
            : novncMod.default?.default;
        if (typeof RFB !== 'function') {
          throw new Error('noVNC RFB export not found');
        }
        const target = document.getElementById('screen');
        errEl.textContent = '';
        rfb = new RFB(target, ws, {
          credentials: { password: pwd },
          shared: false,
        });
        // Match remote framebuffer size to the viewer (ExtendedDesktopSize); avoid blurry CSS upscaling.
        rfb.scaleViewport = false;
        rfb.resizeSession = true;
        rfb.qualityLevel = 9;
        rfb.addEventListener('connect', () => bumpNovncLayout());
        rfb.addEventListener('disconnect', (e) => {
          if (!e.detail.clean) {
            errEl.textContent = 'Disconnected from VM console.';
          }
        });
        rfb.addEventListener('securityfailure', () => {
          errEl.textContent = 'VNC security handshake failed.';
        });
      } catch (e) {
        errEl.textContent = 'Failed to load console: ' + (e && e.message ? e.message : String(e));
      }
    </script>
  </body>
</html>
